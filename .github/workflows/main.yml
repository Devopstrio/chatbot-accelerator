name: Chatbot Accelerator CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Backend Tests
        run: |
          cd apps/api
          pip install -r requirements.txt
          pytest
          
      - name: Frontend Build
        run: |
          cd apps/web
          npm install
          npm run build

  deploy-infra:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: cd infrastructure/terraform/envs/prod && terraform init
      - name: Terraform Apply
        run: cd infrastructure/terraform/envs/prod && terraform apply -auto-approve

  deploy-apps:
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AKS
        run: |
          az aks get-credentials --resource-group rg-prod --name aks-prod
          helm upgrade --install chatbot k8s/helm/chart
